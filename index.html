<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>药品知识问答系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh; padding: 20px;
}
.container { max-width: 800px; margin: 0 auto; }
.header { text-align: center; color: white; margin-bottom: 24px; }
.header h1 { font-size: 26px; margin-bottom: 6px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
.header p { font-size: 13px; opacity: 0.9; }

.stats-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.stat-card { flex: 1; min-width: 80px; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
  border-radius: 12px; padding: 12px; text-align: center; color: white; border: 1px solid rgba(255,255,255,0.2); }
.stat-card .num { font-size: 24px; font-weight: bold; }
.stat-card .label { font-size: 11px; opacity: 0.85; margin-top: 2px; }

.mode-selector { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.mode-btn { flex: 1; min-width: 80px; padding: 10px 8px; border: 2px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.1); color: white; border-radius: 10px; cursor: pointer;
  font-size: 13px; transition: all 0.3s; text-align: center; }
.mode-btn:hover { background: rgba(255,255,255,0.2); }
.mode-btn.active { background: white; color: #667eea; font-weight: bold; border-color: white; }

.quiz-card { background: white; border-radius: 16px; padding: 24px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15); margin-bottom: 16px; }

.login-card { text-align: center; padding: 40px 24px; }
.login-card .icon { font-size: 50px; margin-bottom: 16px; }
.login-card h2 { font-size: 22px; color: #333; margin-bottom: 8px; }
.login-card p { color: #888; font-size: 14px; margin-bottom: 24px; }
.login-input { width: 100%; max-width: 300px; padding: 14px 18px;
  border: 2px solid #e8e8e8; border-radius: 12px; font-size: 16px;
  text-align: center; outline: none; transition: border-color 0.3s; }
.login-input:focus { border-color: #667eea; }
.login-input::placeholder { color: #ccc; }
.login-btn { display: block; width: 100%; max-width: 300px; margin: 16px auto 0;
  padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2);
  color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
.login-btn:hover { opacity: 0.9; }
.login-history { margin-top: 20px; font-size: 13px; color: #999; }

.progress-bar { height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
.progress-fill { height: 100%; background: white; border-radius: 3px; transition: width 0.5s ease; }

.question-num { display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2);
  color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 14px; }
.question-text { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 20px; line-height: 1.5; }
.question-text .highlight { color: #667eea; font-weight: 700; }

.options { display: flex; flex-direction: column; gap: 10px; }
.option-btn { display: flex; align-items: center; padding: 14px 16px;
  border: 2px solid #e8e8e8; border-radius: 12px; cursor: pointer;
  transition: all 0.25s; background: #fafafa; text-align: left; }
.option-btn:hover:not(.disabled) { border-color: #667eea; background: #f0f0ff; transform: translateX(4px); }
.option-btn .opt-letter { width: 30px; height: 30px; border-radius: 50%; background: #e8e8e8;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; color: #666; margin-right: 12px; flex-shrink: 0; font-size: 13px; }
.option-btn .opt-text { font-size: 14px; color: #333; line-height: 1.4; }
.option-btn.correct { border-color: #52c41a; background: #f6ffed; }
.option-btn.correct .opt-letter { background: #52c41a; color: white; }
.option-btn.wrong { border-color: #ff4d4f; background: #fff2f0; }
.option-btn.wrong .opt-letter { background: #ff4d4f; color: white; }
.option-btn.disabled { cursor: default; pointer-events: none; }

.feedback { margin-top: 16px; padding: 14px 16px; border-radius: 12px; font-size: 13px; line-height: 1.6; display: none; }
.feedback.show { display: block; }
.feedback.correct-fb { background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; }
.feedback.wrong-fb { background: #fff2f0; border: 1px solid #ffccc7; color: #cf1322; }
.feedback .answer-detail { color: #333; font-weight: 600; }

.next-btn { display: block; width: 100%; padding: 14px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white; border: none; border-radius: 12px;
  font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 14px; }
.next-btn:hover { opacity: 0.9; }
.next-btn:disabled { opacity: 0.5; cursor: default; }

.result-card { text-align: center; padding: 30px 20px; }
.result-card .emoji { font-size: 50px; margin-bottom: 12px; }
.result-card .title { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 6px; }
.result-card .score { font-size: 42px; font-weight: bold; background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 12px 0; }
.result-card .detail { color: #666; font-size: 14px; line-height: 1.8; }
.result-card .user-info { color: #999; font-size: 13px; margin-top: 8px; }
.result-btns { display: flex; gap: 10px; margin-top: 20px; justify-content: center; flex-wrap: wrap; }
.result-btn { padding: 12px 28px; border-radius: 10px; font-size: 14px; font-weight: bold;
  cursor: pointer; border: none; transition: all 0.3s; }
.result-btn.primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
.result-btn.secondary { background: #f0f0f0; color: #666; }
.result-btn:hover { opacity: 0.85; }

.leaderboard { margin-top: 20px; text-align: left; }
.leaderboard h3 { font-size: 16px; color: #333; margin-bottom: 12px; text-align: center; }
.lb-item { display: flex; align-items: center; padding: 10px 14px;
  border-bottom: 1px solid #f0f0f0; font-size: 13px; }
.lb-item:last-child { border-bottom: none; }
.lb-rank { width: 28px; font-weight: bold; color: #999; }
.lb-rank.gold { color: #faad14; } .lb-rank.silver { color: #8c8c8c; } .lb-rank.bronze { color: #d48806; }
.lb-name { flex: 1; color: #333; font-weight: 500; }
.lb-score { color: #667eea; font-weight: bold; }
.lb-date { color: #ccc; font-size: 11px; margin-left: 8px; }
.lb-empty { text-align: center; color: #ccc; padding: 20px; font-size: 13px; }

.action-bar { text-align: center; margin-top: 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.action-btn { background: rgba(255,255,255,0.15); color: white;
  border: 1px solid rgba(255,255,255,0.3); padding: 10px 22px; border-radius: 10px;
  cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.3s; }
.action-btn:hover { background: rgba(255,255,255,0.3); }
.action-btn.primary { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.5); }

/* 管理员面板 */
.admin-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6); z-index: 200; overflow-y: auto; padding: 20px; }
.admin-overlay.show { display: block; }
.admin-panel { background: white; border-radius: 16px; max-width: 960px;
  margin: 0 auto; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
.admin-header h2 { font-size: 20px; color: #333; }
.admin-close { width: 36px; height: 36px; border-radius: 50%; border: none;
  background: #f5f5f5; font-size: 18px; cursor: pointer; color: #666; }
.admin-close:hover { background: #e8e8e8; }

.admin-toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.admin-search { flex: 1; min-width: 150px; padding: 10px 14px;
  border: 2px solid #e8e8e8; border-radius: 10px; font-size: 14px; outline: none; }
.admin-search:focus { border-color: #667eea; }
.admin-tool-btn { padding: 10px 18px; border-radius: 10px; font-size: 13px;
  font-weight: bold; cursor: pointer; border: none; transition: all 0.3s; white-space: nowrap; }
.admin-tool-btn.export-all { background: linear-gradient(135deg, #52c41a, #389e0d); color: white; }
.admin-tool-btn.import-csv { background: linear-gradient(135deg, #1890ff, #096dd9); color: white; }
.admin-tool-btn.clear-all { background: linear-gradient(135deg, #ff4d4f, #cf1322); color: white; }
.admin-tool-btn:hover { opacity: 0.85; transform: translateY(-1px); }

.admin-summary { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.admin-stat { flex: 1; min-width: 100px; background: #f8f9fa; border-radius: 10px;
  padding: 12px; text-align: center; }
.admin-stat .val { font-size: 22px; font-weight: bold; color: #667eea; }
.admin-stat .lbl { font-size: 11px; color: #999; margin-top: 2px; }

.admin-table-wrap { overflow-x: auto; max-height: 50vh; border: 1px solid #f0f0f0; border-radius: 10px; }
.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.admin-table th { background: linear-gradient(135deg, #667eea, #764ba2);
  color: white; padding: 10px 12px; text-align: left; position: sticky; top: 0; z-index: 1;
  cursor: pointer; user-select: none; white-space: nowrap; }
.admin-table th:hover { opacity: 0.9; }
.admin-table td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; color: #333; }
.admin-table tbody tr:hover td { background: #f5f5ff; }
.rate-badge { display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: 12px; font-weight: bold; color: white; }
.rate-badge.high { background: #52c41a; }
.rate-badge.mid { background: #faad14; }
.rate-badge.low { background: #ff4d4f; }

.admin-detail { margin-top: 16px; }
.admin-detail h3 { font-size: 16px; color: #333; margin-bottom: 10px; }
.admin-detail-wrap { overflow-x: auto; max-height: 40vh; border: 1px solid #f0f0f0; border-radius: 10px; }
.detail-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.detail-table th { background: #f0f2ff; color: #667eea; padding: 8px 10px; text-align: left;
  position: sticky; top: 0; z-index: 1; }
.detail-table td { padding: 8px 10px; border-bottom: 1px solid #f5f5f5; color: #555; }
.detail-table .correct-row { background: #f6ffed; }
.detail-table .wrong-row { background: #fff2f0; }

.sync-hint { text-align: center; color: #999; font-size: 12px;
  margin-top: 16px; padding: 12px; background: #f8f9fa; border-radius: 8px; line-height: 1.8; }
.sync-hint b { color: #667eea; }

.sort-indicator { font-size: 10px; margin-left: 4px; }
.person-summary { cursor: pointer; }
.person-summary:hover td { background: #eef0ff !important; }
.person-summary.active td { background: #e8ebff !important; }
.person-summary td:first-child { font-weight: bold; }

@media (max-width: 600px) {
  .header h1 { font-size: 20px; }
  .quiz-card { padding: 18px; }
  .question-text { font-size: 16px; }
  .stat-card .num { font-size: 20px; }
  .mode-btn { font-size: 12px; padding: 8px 4px; }
  .admin-panel { padding: 16px; }
  .admin-header h2 { font-size: 18px; }
  .admin-table { font-size: 12px; }
  .admin-table th, .admin-table td { padding: 8px 6px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>💊 药品知识问答系统</h1>
    <p>选择题练习 · 自动计分 · <span id="cloud-sync-indicator" style="color:#999;">☁️ 连接中...</span></p>
  </div>

  <div class="stats-bar">
    <div class="stat-card"><div class="num" id="stat-total">0</div><div class="label">总题数</div></div>
    <div class="stat-card"><div class="num" id="stat-correct">0</div><div class="label">✅ 正确</div></div>
    <div class="stat-card"><div class="num" id="stat-wrong">0</div><div class="label">❌ 错误</div></div>
    <div class="stat-card"><div class="num" id="stat-rate">-</div><div class="label">正确率</div></div>
  </div>

  <div class="mode-selector">
    <div class="mode-btn active" data-mode="all" onclick="setMode('all')">🎲 混合</div>
    <div class="mode-btn" data-mode="usage" onclick="setMode('usage')">💊 主治</div>
    <div class="mode-btn" data-mode="factory" onclick="setMode('factory')">🏭 厂家</div>
    <div class="mode-btn" data-mode="product" onclick="setMode('product')">📦 商品</div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="quiz-card" id="quiz-card"></div>

  <div class="action-bar">
    <button class="action-btn" onclick="showExportModal()">📊 导出我的成绩</button>
    <button class="action-btn primary" onclick="openAdmin()">👨‍💼 查看所有得分</button>
  </div>
</div>

<!-- 导出弹窗 -->
<div class="modal-overlay" id="export-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:100;justify-content:center;align-items:center;">
  <div style="background:white;border-radius:16px;padding:30px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="font-size:18px;color:#333;">📊 我的成绩记录</h3>
      <button onclick="closeExportModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#999;">✕</button>
    </div>
    <div id="export-content"></div>
  </div>
</div>

<!-- 管理员面板 -->
<div class="admin-overlay" id="admin-overlay">
  <div class="admin-panel">
    <div class="admin-header">
      <h2>👨‍💼 全部得分总览</h2>
      <button class="admin-close" onclick="closeAdmin()">✕</button>
    </div>
    <div id="admin-import-hint" style="display:none;background:#fffbe6;border:1px solid #ffe58f;border-radius:8px;padding:10px 14px;font-size:12px;color:#d48806;margin-bottom:12px;"></div>
    <div class="admin-toolbar">
      <input class="admin-search" id="admin-search" type="text" placeholder="🔍 搜索姓名..." oninput="renderAdminTable()">
      <button class="admin-tool-btn export-all" onclick="exportAllCSV()">📥 导出全部</button>
      <button class="admin-tool-btn import-csv" onclick="document.getElementById('import-file').click()">📤 导入CSV</button>
      <button class="admin-tool-btn clear-all" onclick="confirmClearAll()">🗑️ 清空</button>
      <input type="file" id="import-file" accept=".csv" style="display:none" onchange="importCSV(event)">
    </div>
    <div class="admin-summary" id="admin-summary"></div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th onclick="sortAdmin('rank')">#</th>
            <th onclick="sortAdmin('name')">姓名</th>
            <th onclick="sortAdmin('attempts')">答题次数</th>
            <th onclick="sortAdmin('best')">最佳成绩</th>
            <th onclick="sortAdmin('avg')">平均正确率</th>
            <th onclick="sortAdmin('lastTime')">最近答题</th>
          </tr>
        </thead>
        <tbody id="admin-tbody"></tbody>
      </table>
    </div>
    <div class="admin-detail" id="admin-detail" style="display:none;">
      <h3 id="admin-detail-title">📋 答题明细</h3>
      <div class="admin-detail-wrap">
        <table class="detail-table">
          <thead>
            <tr><th>#</th><th>题型</th><th>题目</th><th>你的答案</th><th>正确答案</th><th>结果</th><th>时间</th></tr>
          </thead>
          <tbody id="admin-detail-tbody"></tbody>
        </table>
      </div>
      <div style="text-align:center;margin-top:10px;">
        <button onclick="hideDetail()" style="padding:8px 20px;border:1px solid #ddd;border-radius:8px;background:#f5f5f5;cursor:pointer;font-size:13px;">收起明细</button>
      </div>
    </div>
    <div class="sync-hint">
      💡 <b>跨设备同步：</b>所有成绩通过云端自动同步，任何设备上答题后数据实时共享，无需手动导入导出。
    </div>
  </div>
</div>

// ===== 云端存储（jsonbin.io）=====
async function cloudPull() {
  try {
    const r = await fetch(CLOUD_API_URL + '/latest', {
      headers: { 'X-Master-Key': CLOUD_API_KEY }
    });
    if (!r.ok) return null;
    const json = await r.json();
    const data = json.record;
    if (!data || !Array.isArray(data.scores)) return null;
    const cloudScores = data.scores;
    // 合并本地与云端（以 姓名+时间+正确率 去重）
    const localScores = getScores();
    const keyOf = s => `${s.name}|${s.time}|${s.rate}`;
    const keySet = new Set(cloudScores.map(keyOf));
    localScores.forEach(s => {
      if (!keySet.has(keyOf(s))) cloudScores.push(s);
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cloudScores));
    return cloudScores;
  } catch (e) { console.warn('cloudPull failed:', e); }
  return null;
}

async function cloudPush() {
  if (cloudSyncing) return;
  cloudSyncing = true;
  updateSyncIndicator('syncing');
  try {
    const scores = getScores();
    await fetch(CLOUD_API_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': CLOUD_API_KEY
      },
      body: JSON.stringify({ scores })
    });
    updateSyncIndicator('synced');
  } catch (e) {
    console.warn('cloudPush failed:', e);
    updateSyncIndicator('offline');
  } finally {
    cloudSyncing = false;
  }
}

async function syncScoresFromCloud() {
  const data = await cloudPull();
  return data;
}

function updateSyncIndicator(status) {
  const el = document.getElementById('cloud-sync-indicator');
  if (!el) return;
  const map = {
    syncing: { text: '☁️ 同步中...', color: '#1890ff' },
    synced:  { text: '☁️ 已同步', color: '#52c41a' },
    offline: { text: '⚠️ 同步失败', color: '#fa8c16' },
    local:   { text: '📴 本地模式', color: '#999' }
  };
  const s = map[status] || map.local;
  el.textContent = s.text;
  el.style.color = s.color;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function getDistractors(correctVal, pool, count = 3) {
  const unique = [...new Set(pool.map(d => d))].filter(v => v !== correctVal);
  return shuffle(unique).slice(0, count);
}

  let mode = currentMode;
  if (mode === 'all') mode = ['usage', 'factory', 'product'][Math.floor(Math.random() * 3)];
  let q = {};
  if (mode === 'usage') {
    const correct = drug.usage;
    q = { text: `商品名 <span class="highlight">${drug.product}</span> 的功能主治是？`, correct, options: shuffle([correct, ...getDistractors(correct, drugs.map(d => d.usage), 3)]), detail: `${drug.product}（${drug.factory}）→ ${drug.usage}` };
  } else if (mode === 'factory') {
    const correct = drug.factory;
    q = { text: `商品名 <span class="highlight">${drug.product}</span> 的生产厂家是？`, correct, options: shuffle([correct, ...getDistractors(correct, drugs.map(d => d.factory), 3)]), detail: `${drug.product}（${drug.factory}）→ ${drug.usage}` };
  } else {
    const correct = drug.product;
    const askByUsage = Math.random() > 0.5;
    if (askByUsage) {
      q = { text: `功能主治为 <span class="highlight">${drug.usage}</span> 的药品是？`, correct, options: shuffle([correct, ...getDistractors(correct, drugs.map(d => d.product), 3)]), detail: `${drug.product}（${drug.factory}）→ ${drug.usage}` };
    } else {
      q = { text: `<span class="highlight">${drug.factory}</span> 生产的药品是？`, correct, options: shuffle([correct, ...getDistractors(correct, drugs.map(d => d.product), 3)]), detail: `${drug.product}（${drug.factory}）→ ${drug.usage}` };
    }
  }
  q.mode = mode;
  return q;
}

function renderQuestion() {
  answered = false;
  questionNum++;
  currentQuestion = generateQuestion();
  const letters = ['A', 'B', 'C', 'D'];
  const modeLabels = { usage: '💊 功能主治', factory: '🏭 生产厂家', product: '📦 商品名' };
  let html = `<div class="question-num">第 ${questionNum}/${TOTAL_QUESTIONS} 题 · ${modeLabels[currentQuestion.mode]}</div>
    <div class="question-text">${currentQuestion.text}</div><div class="options">`;
  currentQuestion.options.forEach((opt, i) => {
    html += `<div class="option-btn" onclick="selectOption(${i})" id="opt-${i}">
      <div class="opt-letter">${letters[i]}</div><div class="opt-text">${opt}</div></div>`;
  });
  html += `</div><div class="feedback" id="feedback"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()" disabled>选择答案后继续</button>`;
  document.getElementById('quiz-card').innerHTML = html;
  updateProgress();
}

function selectOption(idx) {
  if (answered) return;
  answered = true;
  const selected = currentQuestion.options[idx];
  const isCorrect = selected === currentQuestion.correct;
  stats.total++;
  if (isCorrect) stats.correct++; else stats.wrong++;
  questionDetails.push({
    num: questionNum, mode: currentQuestion.mode,
    question: currentQuestion.text.replace(/<[^>]+>/g, ''),
    selected, correct: currentQuestion.correct, isCorrect
  });
  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.classList.add('disabled');
    if (currentQuestion.options[i] === currentQuestion.correct) btn.classList.add('correct');
    if (i === idx && !isCorrect) btn.classList.add('wrong');
  });
  const fb = document.getElementById('feedback');
  fb.classList.add('show');
  if (isCorrect) { fb.classList.add('correct-fb'); fb.innerHTML = '✅ 回答正确！'; }
  else { fb.classList.add('wrong-fb'); fb.innerHTML = `❌ 回答错误！<br><span class="answer-detail">正确答案：${currentQuestion.correct}</span><br>📖 ${currentQuestion.detail}`; }
  const nextBtn = document.getElementById('next-btn');
  nextBtn.disabled = false;
  nextBtn.textContent = questionNum >= TOTAL_QUESTIONS ? '📊 查看成绩' : '👉 下一题';
  updateStats();
}

function nextQuestion() {
  if (!answered) return;
  if (questionNum >= TOTAL_QUESTIONS) showResult();
  else renderQuestion();
}

function showResult() {
  const rate = Math.round(stats.correct / stats.total * 100);
  let emoji = '🎉', title = '太棒了！';
  if (rate < 60) { emoji = '💪'; title = '继续加油！'; }
  else if (rate < 80) { emoji = '👍'; title = '表现不错！'; }
  else if (rate < 100) { emoji = '🌟'; title = '非常优秀！'; }
  addScore(currentUser, stats.correct, stats.total, rate, currentMode, questionDetails);
  const scores = getScores();
  const myBest = Math.max(...scores.filter(s => s.name === currentUser).map(s => s.rate));
  const allBest = Math.max(...scores.map(s => s.rate));
  const topScores = [...scores].sort((a, b) => b.rate - a.rate).slice(0, 5);
  let lbHtml = '<div class="leaderboard"><h3>🏆 排行榜 TOP5</h3>';
  if (topScores.length === 0) { lbHtml += '<div class="lb-empty">暂无记录</div>'; }
  else {
    topScores.forEach((s, i) => {
      const rc = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
      lbHtml += `<div class="lb-item"><div class="lb-rank ${rc}">${medal}</div><div class="lb-name">${s.name}</div><div class="lb-score">${s.rate}%</div><div class="lb-date">${s.time}</div></div>`;
    });
  }
  lbHtml += '</div>';
  document.getElementById('quiz-card').innerHTML = `
    <div class="result-card">
      <div class="emoji">${emoji}</div>
      <div class="title">${title}</div>
      <div class="user-info">👤 ${currentUser}</div>
      <div class="score">${rate}分</div>
      <div class="detail">共 ${stats.total} 题 · 正确 ${stats.correct} 题 · 错误 ${stats.wrong} 题<br>
        历史最佳：${myBest}% · 全场最高：${allBest}%<br>答题时间：${quizStartTime.toLocaleString('zh-CN')}</div>
      ${lbHtml}
      <div class="result-btns">
        <button class="result-btn primary" onclick="restart()">🔄 再来一轮</button>
        <button class="result-btn secondary" onclick="showLogin()">👤 换人答题</button>
      </div>
    </div>`;
  document.getElementById('progress-fill').style.width = '100%';
}

function restart() {
  stats = { total: 0, correct: 0, wrong: 0 };
  questionNum = 0; questionDetails = [];
  quizStartTime = new Date();
  updateStats(); renderQuestion();
}

function updateStats() {
  document.getElementById('stat-total').textContent = stats.total;
  document.getElementById('stat-correct').textContent = stats.correct;
  document.getElementById('stat-wrong').textContent = stats.wrong;
  document.getElementById('stat-rate').textContent = stats.total > 0 ? Math.round(stats.correct / stats.total * 100) + '%' : '-';
}

function updateProgress() {
  document.getElementById('progress-fill').style.width = ((questionNum - 1) / TOTAL_QUESTIONS * 100) + '%';
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
  if (!currentUser) { showLogin(); return; }
  if (questionNum >= TOTAL_QUESTIONS) restart();
  else { questionNum--; renderQuestion(); }
}

// ===== 个人导出 =====
async function showExportModal() {
  await syncScoresFromCloud();
  const scores = getScores();
  const modal = document.getElementById('export-modal');
  const content = document.getElementById('export-content');
  if (scores.length === 0) {
    content.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">暂无成绩记录</p>';
  } else {
    let html = '<table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px;">';
    html += '<thead><tr><th style="background:#f5f5f5;padding:8px;text-align:left;border-bottom:2px solid #e8e8e8;">姓名</th><th style="background:#f5f5f5;padding:8px;text-align:left;border-bottom:2px solid #e8e8e8;">正确</th><th style="background:#f5f5f5;padding:8px;text-align:left;border-bottom:2px solid #e8e8e8;">总题</th><th style="background:#f5f5f5;padding:8px;text-align:left;border-bottom:2px solid #e8e8e8;">正确率</th><th style="background:#f5f5f5;padding:8px;text-align:left;border-bottom:2px solid #e8e8e8;">模式</th><th style="background:#f5f5f5;padding:8px;text-align:left;border-bottom:2px solid #e8e8e8;">时间</th></tr></thead><tbody>';
    scores.forEach(s => {
      html += `<tr><td style="padding:8px;border-bottom:1px solid #f0f0f0;">${s.name}</td><td style="padding:8px;border-bottom:1px solid #f0f0f0;">${s.score}</td><td style="padding:8px;border-bottom:1px solid #f0f0f0;">${s.total}</td><td style="padding:8px;border-bottom:1px solid #f0f0f0;"><b>${s.rate}%</b></td><td style="padding:8px;border-bottom:1px solid #f0f0f0;">${modeNames[s.mode]||s.mode}</td><td style="padding:8px;border-bottom:1px solid #f0f0f0;">${s.time}</td></tr>`;
    });
    html += '</tbody></table>';
    html += '<button onclick="exportMyCSV()" style="display:block;width:100%;padding:12px;background:linear-gradient(135deg,#52c41a,#389e0d);color:white;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;">📥 导出为 CSV（可发送给管理员汇总）</button>';
    content.innerHTML = html;
  }
  modal.style.display = 'flex';
}

function closeExportModal() {
  document.getElementById('export-modal').style.display = 'none';
}

function generateCSV(scores, includeDetails) {
  let csv = '\uFEFF姓名,正确数,总题数,正确率,答题模式,答题时间\n';
  scores.forEach(s => {
    csv += `"${s.name}",${s.score},${s.total},"${s.rate}%","${modeNames[s.mode]||s.mode}","${s.time}"\n`;
  });
  if (includeDetails) {
    csv += '\n\n===== 详细答题记录 =====\n\n';
    csv += '姓名,题号,题型,题目,你的答案,正确答案,是否正确,答题时间\n';
    scores.forEach(s => {
      if (s.details) {
        s.details.forEach(d => {
          const mn = modeNames[d.mode] || d.mode;
          const r = d.isCorrect ? '正确' : '错误';
          csv += `"${s.name}",${d.num},"${mn}","${d.question}","${d.selected}","${d.correct}","${r}","${s.time}"\n`;
        });
      }
    });
  }
  return csv;
}

function downloadCSV(csv, filename) {
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
  URL.revokeObjectURL(link.href);
}

function exportMyCSV() {
  const scores = getScores();
  if (scores.length === 0) return;
  downloadCSV(generateCSV(scores, true), `药品知识答题成绩_${new Date().toISOString().slice(0,10)}.csv`);
}

// ===== 管理员面板 =====
async function openAdmin() {
  selectedPerson = null;
  document.getElementById('admin-detail').style.display = 'none';
  await syncScoresFromCloud();
  renderAdminTable();
  document.getElementById('admin-overlay').style.display = 'block';
}
function closeAdmin() {
  document.getElementById('admin-overlay').style.display = 'none';
}

function renderAdminTable() {
  const scores = getScores();
  const searchVal = (document.getElementById('admin-search').value || '').trim().toLowerCase();
  const filtered = searchVal ? scores.filter(s => s.name.toLowerCase().includes(searchVal)) : scores;

  // 按姓名分组统计
  const personMap = {};
  filtered.forEach(s => {
    if (!personMap[s.name]) personMap[s.name] = { attempts: [], best: 0, totalScore: 0 };
    personMap[s.name].attempts.push(s);
    if (s.rate > personMap[s.name].best) personMap[s.name].best = s.rate;
    personMap[s.name].totalScore += s.rate;
  });

  let personList = Object.entries(personMap).map(([name, data]) => ({
    name,
    attempts: data.attempts.length,
    best: data.best,
    avg: Math.round(data.totalScore / data.attempts.length),
    lastTime: data.attempts[data.attempts.length - 1].time,
    records: data.attempts
  }));

  // 排序
  personList.sort((a, b) => {
    let va, vb;
    switch (adminSortKey) {
      case 'name': return adminSortDir * a.name.localeCompare(b.name, 'zh');
      case 'attempts': va = a.attempts; vb = b.attempts; break;
      case 'best': va = a.best; vb = b.best; break;
      case 'avg': va = a.avg; vb = b.avg; break;
      case 'lastTime': return adminSortDir * a.lastTime.localeCompare(b.lastTime, 'zh');
      default: va = a.best; vb = b.best;
    }
    return adminSortDir * (vb - va);
  });

  // 统计汇总
  const uniqueNames = [...new Set(scores.map(s => s.name))];
  const avgRate = scores.length > 0 ? Math.round(scores.reduce((sum, s) => sum + s.rate, 0) / scores.length) : 0;
  const bestRate = scores.length > 0 ? Math.max(...scores.map(s => s.rate)) : 0;

  document.getElementById('admin-summary').innerHTML = `
    <div class="admin-stat"><div class="val">${uniqueNames.length}</div><div class="lbl">参与人数</div></div>
    <div class="admin-stat"><div class="val">${scores.length}</div><div class="lbl">总答题次数</div></div>
    <div class="admin-stat"><div class="val">${avgRate}%</div><div class="lbl">平均正确率</div></div>
    <div class="admin-stat"><div class="val">${bestRate}%</div><div class="lbl">最高正确率</div></div>`;

  const getSortIcon = (key) => adminSortKey === key ? (adminSortDir > 0 ? ' ↑' : ' ↓') : '';

  let html = '';
  personList.forEach((p, i) => {
    const rateClass = p.best >= 80 ? 'high' : p.best >= 60 ? 'mid' : 'low';
    const activeClass = selectedPerson === p.name ? ' active' : '';
    html += `<tr class="person-summary${activeClass}" onclick="showPersonDetail('${p.name.replace(/'/g, "\\'")}')">
      <td>${i + 1}</td>
      <td><b>${p.name}</b></td>
      <td>${p.attempts}次</td>
      <td><span class="rate-badge ${rateClass}">${p.best}%</span></td>
      <td>${p.avg}%</td>
      <td style="color:#999;font-size:12px;">${p.lastTime}</td>
    </tr>`;
  });

  if (personList.length === 0) {
    html = '<tr><td colspan="6" style="text-align:center;color:#ccc;padding:30px;">暂无数据</td></tr>';
  }

  document.getElementById('admin-tbody').innerHTML = html;
}

function sortAdmin(key) {
  if (adminSortKey === key) adminSortDir *= -1;
  else { adminSortKey = key; adminSortDir = key === 'name' || key === 'lastTime' ? 1 : -1; }
  renderAdminTable();
}

function showPersonDetail(name) {
  selectedPerson = name;
  renderAdminTable();
  const scores = getScores().filter(s => s.name === name);
  document.getElementById('admin-detail-title').textContent = `📋 ${name} 的答题明细（共${scores.length}次）`;
  let html = '';
  scores.slice().reverse().forEach(s => {
    if (s.details) {
      s.details.forEach(d => {
        const mn = modeNames[d.mode] || d.mode;
        const r = d.isCorrect ? '✅正确' : '❌错误';
        const cls = d.isCorrect ? 'correct-row' : 'wrong-row';
        html += `<tr class="${cls}"><td>${d.num}</td><td>${mn}</td><td>${d.question}</td><td>${d.selected}</td><td>${d.correct}</td><td>${r}</td><td style="color:#999;font-size:11px;">${s.time}</td></tr>`;
      });
    }
  });
  if (!html) html = '<tr><td colspan="7" style="text-align:center;color:#ccc;padding:20px;">无详细记录</td></tr>';
  document.getElementById('admin-detail-tbody').innerHTML = html;
  document.getElementById('admin-detail').style.display = 'block';
  document.getElementById('admin-detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function hideDetail() {
  selectedPerson = null;
  document.getElementById('admin-detail').style.display = 'none';
  renderAdminTable();
}

function exportAllCSV() {
  const scores = getScores();
  if (scores.length === 0) { alert('暂无数据可导出'); return; }
  downloadCSV(generateCSV(scores, true), `药品问答_全部成绩汇总_${new Date().toISOString().slice(0,10)}.csv`);
}

function confirmClearAll() {
  const scores = getScores();
  if (scores.length === 0) { alert('暂无数据'); return; }
  if (confirm(`确定要清空全部 ${scores.length} 条成绩记录吗？\n此操作不可恢复！\n建议先点击「导出全部」备份。`)) {
    saveScores([]);
    selectedPerson = null;
    document.getElementById('admin-detail').style.display = 'none';
    renderAdminTable();
    showImportHint('✅ 已清空全部记录');
  }
}

// CSV 导入
function importCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const text = e.target.result;
      const lines = text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('=====') && !l.startsWith('姓名,题号'));
      const existingScores = getScores();
      const existingKeys = new Set(existingScores.map(s => s.name + '|' + s.time));
      let imported = 0, skipped = 0;
      lines.forEach(line => {
        if (line.startsWith('\uFEFF')) line = line.substring(1);
        if (line === '姓名,正确数,总题数,正确率,答题模式,答题时间') return;
        const values = parseCSVLine(line);
        if (values.length >= 6) {
          const name = values[0];
          const score = parseInt(values[1]);
          const total = parseInt(values[2]);
          const rateStr = values[3].replace(/"/g, '').replace('%', '');
          const rate = parseInt(rateStr);
          const modeStr = values[4];
          const time = values[5];
          const modeMap = { '混合': 'all', '主治': 'usage', '厂家': 'factory', '商品': 'product' };
          const mode = modeMap[modeStr] || modeStr;
          const key = name + '|' + time;
          if (!existingKeys.has(key) && name && !isNaN(score) && !isNaN(total) && !isNaN(rate)) {
            existingScores.push({ name, score, total, rate, time, mode, details: [] });
            existingKeys.add(key);
            imported++;
          } else {
            skipped++;
          }
        }
      });
      saveScores(existingScores);
      cloudPush(); // 导入后同步到云端
      renderAdminTable();
      let msg = `✅ 成功导入 ${imported} 条成绩记录！`;
      if (skipped > 0) msg += `（跳过 ${skipped} 条重复记录）`;
      showImportHint(msg);
    } catch (err) {
      showImportHint('❌ 导入失败：' + err.message);
    }
  };
  reader.readAsText(file, 'UTF-8');
  event.target.value = '';
}

function parseCSVLine(line) {
  const values = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === ',' && !inQuotes) { values.push(current.trim()); current = ''; }
    else { current += ch; }
  }
  values.push(current.trim());
  return values;
}

function showImportHint(msg) {
  const hint = document.getElementById('admin-import-hint');
  hint.textContent = msg;
  hint.style.display = 'block';
  setTimeout(() => { hint.style.display = 'none'; }, 5000);
}
